<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador 3D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
      }

      #info {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 12px;
        border-radius: 10px;
        max-width: 320px;
        font-size: 14px;
        line-height: 1.4;
      }

      #previewPanel {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 260px;
        background: rgba(0, 0, 0, 0.75);
        padding: 10px;
        border-radius: 10px;
        color: white;
        z-index: 10;
      }

      #previewImage {
        width: 100%;
        display: block;
        border-radius: 8px;
        margin-bottom: 8px;
        background: #222;
        min-height: 120px;
        object-fit: contain;
      }

      #previewMeta {
        font-size: 12px;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">
      <strong>Visualizador 3D</strong><br />
      - Arrastrar: orbitar<br />
      - Rueda: zoom<br />
      - Click en un punto: ver preview
    </div>

    <div id="previewPanel">
      <img id="previewImage" alt="preview" />
      <div id="previewMeta">Selecciona una imagen</div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      let scene, camera, renderer, controls, raycaster, pointer;
      let pointMeshes = [];
      let selectedPoint = null;

      const previewImage = document.getElementById("previewImage");
      const previewMeta = document.getElementById("previewMeta");

      init();
      loadData();

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        camera = new THREE.PerspectiveCamera(
          60,
          window.innerWidth / window.innerHeight,
          0.1,
          5000,
        );
        camera.position.set(0, 0, 180);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        raycaster = new THREE.Raycaster();
        pointer = new THREE.Vector2();

        const ambient = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambient);

        const axes = new THREE.AxesHelper(30);
        scene.add(axes);

        window.addEventListener("resize", onResize);
        window.addEventListener("click", onClick);

        animate();
      }

      async function loadData() {
        const response = await fetch("./latents.json");
        const data = await response.json();

        const items = data.items || [];

        const SCALE = 8;
        const POINT_RADIUS = 0.55;

        const minCoord1d = Math.min(
          ...items.map((it) => Number(it.coord_1d) || 0),
        );
        const maxCoord1d = Math.max(
          ...items.map((it) => Number(it.coord_1d) || 1),
        );
        const rangeCoord1d = Math.max(maxCoord1d - minCoord1d, 1e-9);

        const sphereGeometry = new THREE.SphereGeometry(POINT_RADIUS, 10, 10);

        for (const item of items) {
          const x = item.coord_3d?.x ?? 0;
          const y = item.coord_3d?.y ?? 0;
          const z = item.coord_3d?.z ?? 0;

          const t = (Number(item.coord_1d) - minCoord1d) / rangeCoord1d;
          const color = new THREE.Color().setHSL(0.65 - t * 0.65, 0.9, 0.55);

          const material = new THREE.MeshBasicMaterial({ color });
          const point = new THREE.Mesh(sphereGeometry, material);
          point.position.set(x * SCALE, y * SCALE, z * SCALE);
          point.userData = {
            ...item,
            baseColorHex: color.getHex(),
          };

          scene.add(point);
          pointMeshes.push(point);
        }

        const sorted = [...pointMeshes].sort(
          (a, b) => (a.userData.coord_1d ?? 0) - (b.userData.coord_1d ?? 0),
        );

        const linePoints = [];
        for (let i = 0; i < sorted.length - 1; i++) {
          linePoints.push(sorted[i].position, sorted[i + 1].position);
        }

        const lineGeometry = new THREE.BufferGeometry().setFromPoints(
          linePoints,
        );
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0x6aa9ff,
          transparent: true,
          opacity: 0.35,
        });
        const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
        scene.add(lines);

        console.log(`Cargados ${pointMeshes.length} puntos`);
      }

      function onClick(event) {
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(pointMeshes);

        if (intersects.length > 0) {
          const selected = intersects[0].object;
          const item = selected.userData;

          if (selectedPoint) {
            selectedPoint.scale.set(1, 1, 1);
            selectedPoint.material.color.setHex(
              selectedPoint.userData.baseColorHex,
            );
          }
          selected.scale.set(1.9, 1.9, 1.9);
          selected.material.color.set(0xff0000);
          selectedPoint = selected;

          previewImage.src = `./imagenes_generadas/${item.file}`;
          previewMeta.innerHTML = `
          <strong>${item.file}</strong><br>
          latent_hash_num: ${item.latent_hash_num}<br>
          coord_1d: ${Number(item.coord_1d).toFixed(4)}<br>
          x: ${Number(item.coord_3d.x).toFixed(3)}<br>
          y: ${Number(item.coord_3d.y).toFixed(3)}<br>
          z: ${Number(item.coord_3d.z).toFixed(3)}
        `;
        }
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        controls.update();
        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
