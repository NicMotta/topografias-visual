<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualizador 3D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
      }

      #info {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: white;
        background: rgba(0, 0, 0, 0.65);
        padding: 12px;
        border-radius: 10px;
        max-width: 320px;
        font-size: 14px;
        line-height: 1.4;
      }

      #previewPanel {
        position: absolute;
        right: 12px;
        top: 12px;
        width: 260px;
        background: rgba(0, 0, 0, 0.75);
        padding: 10px;
        border-radius: 10px;
        color: white;
        z-index: 10;
      }

      #previewImage {
        width: 100%;
        display: block;
        border-radius: 8px;
        margin-bottom: 8px;
        background: #222;
        min-height: 120px;
        object-fit: contain;
      }

      #previewMeta {
        font-size: 12px;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

  </head>
  <body>
    <div id="info">
      <strong>Visualizador 3D</strong><br />
      - Arrastrar: orbitar<br />
      - Rueda: zoom<br />
      - Click en un punto: ver preview
    </div>

    <div id="previewPanel">
      <img id="previewImage" alt="preview" />
      <div id="previewMeta">Selecciona una imagen</div>
    </div>

    <script type="module" src="./src/visualizador_3d.js"></script>
  </body>
</html>
