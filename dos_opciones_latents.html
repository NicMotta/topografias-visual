<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2 opciones extra | Imagen + Latents</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e1118;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .lead {
        margin: 0 0 16px;
        opacity: 0.9;
      }

      .panel {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 14px;
      }

      .row {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 12px;
      }

      #mainImg {
        width: 100%;
        border-radius: 10px;
        background: #1b1f2a;
      }

      .meta {
        font-size: 13px;
        line-height: 1.4;
      }

      input[type="range"] {
        width: 100%;
      }

      #spark {
        width: 100%;
        height: 120px;
        background: #111523;
        border-radius: 8px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #2f7cff;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #4a8eff;
      }

      #neighbors {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 8px;
      }

      .card img {
        width: 100%;
        border-radius: 8px;
        background: #1b1f2a;
        cursor: pointer;
      }

      .small {
        font-size: 12px;
        opacity: 0.9;
        line-height: 1.35;
        margin-top: 6px;
        word-break: break-word;
      }

      @media (max-width: 860px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Dos opciones extra con imágenes + latents</h1>
      <p class="lead">
        Opción 1: secuencia por <strong>coord_1d</strong>. Opción 2: vecinos más
        cercanos en el espacio <strong>coord_3d</strong>.
      </p>

      <section class="panel">
        <strong>Opción 1 — Timeline por coord_1d</strong>
        <div class="actions">
          <button id="prevBtn">Anterior</button>
          <button id="nextBtn">Siguiente</button>
          <button id="randomBtn">Aleatorio</button>
        </div>
        <div style="margin-top: 10px">
          <input id="indexSlider" type="range" min="0" max="0" value="0" />
        </div>
      </section>

      <section class="panel row">
        <div>
          <img id="mainImg" alt="imagen seleccionada" />
          <div id="mainMeta" class="meta">Cargando...</div>
        </div>
        <div>
          <canvas id="spark" width="740" height="120"></canvas>
          <div class="small" id="sparkMeta"></div>
        </div>
      </section>

      <section class="panel">
        <strong>Opción 2 — Vecinos más cercanos en coord_3d</strong>
        <div class="small" id="neighborsMeta" style="margin: 8px 0 10px">
          Calculando...
        </div>
        <div id="neighbors"></div>
      </section>
    </div>

    <script>
      let items = [];
      let sorted = [];
      let currentIndex = 0;

      const slider = document.getElementById("indexSlider");
      const mainImg = document.getElementById("mainImg");
      const mainMeta = document.getElementById("mainMeta");
      const spark = document.getElementById("spark");
      const sparkMeta = document.getElementById("sparkMeta");
      const neighbors = document.getElementById("neighbors");
      const neighborsMeta = document.getElementById("neighborsMeta");

      document.getElementById("prevBtn").addEventListener("click", () => {
        setIndex(Math.max(0, currentIndex - 1));
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        setIndex(Math.min(sorted.length - 1, currentIndex + 1));
      });

      document.getElementById("randomBtn").addEventListener("click", () => {
        setIndex(Math.floor(Math.random() * sorted.length));
      });

      slider.addEventListener("input", (e) => {
        setIndex(Number(e.target.value));
      });

      init();

      async function init() {
        const res = await fetch("./latents.json");
        const data = await res.json();
        items = data.items || [];

        sorted = [...items].sort(
          (a, b) => Number(a.coord_1d) - Number(b.coord_1d),
        );

        slider.max = String(Math.max(sorted.length - 1, 0));
        setIndex(Math.floor(sorted.length / 2));
      }

      function setIndex(index) {
        currentIndex = index;
        slider.value = String(index);
        renderCurrent();
      }

      function renderCurrent() {
        if (!sorted.length) return;
        const item = sorted[currentIndex];

        mainImg.src = `./imagenes_generadas/${item.file}`;

        const percentile = (
          (currentIndex / Math.max(sorted.length - 1, 1)) *
          100
        ).toFixed(1);

        mainMeta.innerHTML = `
          <strong>${item.file}</strong><br>
          id: ${item.id}<br>
          índice ordenado: ${currentIndex + 1} / ${sorted.length}<br>
          percentil coord_1d: ${percentile}%<br>
          coord_1d: ${Number(item.coord_1d).toFixed(5)}<br>
          coord_3d: (${Number(item.coord_3d.x).toFixed(3)}, ${Number(item.coord_3d.y).toFixed(3)}, ${Number(item.coord_3d.z).toFixed(3)})
        `;

        drawSparkline();
        renderNeighbors(item);
      }

      function drawSparkline() {
        const ctx = spark.getContext("2d");
        const w = spark.width;
        const h = spark.height;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#111523";
        ctx.fillRect(0, 0, w, h);

        const values = sorted.map((it) => Number(it.coord_1d));
        const min = Math.min(...values);
        const max = Math.max(...values);
        const range = Math.max(max - min, 1e-9);

        ctx.strokeStyle = "#5ca7ff";
        ctx.lineWidth = 1.6;
        ctx.beginPath();

        for (let i = 0; i < values.length; i++) {
          const x = (i / Math.max(values.length - 1, 1)) * (w - 20) + 10;
          const y = h - 10 - ((values[i] - min) / range) * (h - 20);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();

        const cx =
          (currentIndex / Math.max(values.length - 1, 1)) * (w - 20) + 10;
        const cy = h - 10 - ((values[currentIndex] - min) / range) * (h - 20);

        ctx.fillStyle = "#ff4040";
        ctx.beginPath();
        ctx.arc(cx, cy, 4.3, 0, Math.PI * 2);
        ctx.fill();

        sparkMeta.textContent = `Rango coord_1d: min ${min.toFixed(4)} · max ${max.toFixed(4)} · punto actual en rojo`;
      }

      function renderNeighbors(base) {
        const bx = Number(base.coord_3d.x);
        const by = Number(base.coord_3d.y);
        const bz = Number(base.coord_3d.z);

        const list = items
          .filter((it) => it.file !== base.file)
          .map((it) => {
            const dx = Number(it.coord_3d.x) - bx;
            const dy = Number(it.coord_3d.y) - by;
            const dz = Number(it.coord_3d.z) - bz;
            const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
            return {
              item: it,
              d,
              delta1d: Number(it.coord_1d) - Number(base.coord_1d),
            };
          })
          .sort((a, b) => a.d - b.d)
          .slice(0, 8);

        neighborsMeta.innerHTML =
          `Base: <strong>${base.file}</strong> · distancia euclídea en coord_3d: ` +
          `$d=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}$`;

        neighbors.innerHTML = "";

        for (const n of list) {
          const card = document.createElement("article");
          card.className = "card";

          const img = document.createElement("img");
          img.src = `./imagenes_generadas/${n.item.file}`;
          img.alt = n.item.file;
          img.title = "Click para usar esta imagen como base";
          img.addEventListener("click", () => {
            const idx = sorted.findIndex((it) => it.file === n.item.file);
            if (idx >= 0) setIndex(idx);
          });

          const text = document.createElement("div");
          text.className = "small";
          text.innerHTML = `
            <strong>${n.item.file}</strong><br>
            dist: ${n.d.toFixed(4)}<br>
            Δcoord_1d: ${n.delta1d.toFixed(4)}
          `;

          card.appendChild(img);
          card.appendChild(text);
          neighbors.appendChild(card);
        }
      }
    </script>
  </body>
</html>
