<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2 opciones extra | Imagen + Latents</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e1118;
        color: #fff;
        font-family: Arial, sans-serif;
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .lead {
        margin: 0 0 16px;
        opacity: 0.9;
      }

      .panel {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 14px;
      }

      .row {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 12px;
      }

      #mainImg {
        width: 100%;
        border-radius: 10px;
        background: #1b1f2a;
      }

      .meta {
        font-size: 13px;
        line-height: 1.4;
      }

      input[type="range"] {
        width: 100%;
      }

      #spark {
        width: 100%;
        height: 120px;
        background: #111523;
        border-radius: 8px;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #2f7cff;
        color: #fff;
        cursor: pointer;
      }

      button:hover {
        background: #4a8eff;
      }

      #neighbors {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        padding: 8px;
      }

      .card img {
        width: 100%;
        border-radius: 8px;
        background: #1b1f2a;
        cursor: pointer;
      }

      .small {
        font-size: 12px;
        opacity: 0.9;
        line-height: 1.35;
        margin-top: 6px;
        word-break: break-word;
      }

      @media (max-width: 860px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Dos opciones extra con imágenes + latents</h1>
      <p class="lead">
        Opción 1: secuencia por <strong>coord_1d</strong>. Opción 2: vecinos más
        cercanos en el espacio <strong>coord_3d</strong>.
      </p>

      <section class="panel">
        <strong>Opción 1 — Timeline por coord_1d</strong>
        <div class="actions">
          <button id="prevBtn">Anterior</button>
          <button id="nextBtn">Siguiente</button>
          <button id="randomBtn">Aleatorio</button>
        </div>
        <div style="margin-top: 10px">
          <input id="indexSlider" type="range" min="0" max="0" value="0" />
        </div>
      </section>

      <section class="panel row">
        <div>
          <img id="mainImg" alt="imagen seleccionada" />
          <div id="mainMeta" class="meta">Cargando...</div>
        </div>
        <div>
          <canvas id="spark" width="740" height="120"></canvas>
          <div class="small" id="sparkMeta"></div>
        </div>
      </section>

      <section class="panel">
        <strong>Opción 2 — Vecinos más cercanos en coord_3d</strong>
        <div class="small" id="neighborsMeta" style="margin: 8px 0 10px">
          Calculando...
        </div>
        <div id="neighbors"></div>
      </section>
    </div>

    <script type="module" src="./src/dos_opciones_latents.js"></script>
  
  </body>
</html>
