<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convivencia 3D | Puntos + Mapa</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0f1014;
        font-family: Arial, sans-serif;
      }

      #leftPanel,
      #rightPanel {
        position: absolute;
        top: 12px;
        z-index: 10;
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 12px;
      }

      #leftPanel {
        left: 12px;
        width: 300px;
      }

      #rightPanel {
        right: 12px;
        width: 300px;
      }

      #leftPanel button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #2f7cff;
        color: #fff;
        cursor: pointer;
      }

      #leftPanel button:hover {
        background: #4d8fff;
      }

      #preview {
        width: 100%;
        border-radius: 8px;
        margin-top: 8px;
        display: block;
        background: #1a1a1a;
      }

      #meta,
      #mapMeta {
        font-size: 12px;
        margin-top: 8px;
        word-break: break-word;
        line-height: 1.35;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="leftPanel">
      <strong>Convivencia 3D</strong><br />
      - Izquierda: nube de puntos (latents)<br />
      - Derecha: mapa de altura (imagen)<br />
      - Click en punto actualiza mapa + preview
      <br />
      <button id="randomMapBtn">Mapa aleatorio</button>
      <div id="meta">Cargando datos...</div>
    </div>

    <div id="rightPanel">
      <strong>Preview de imagen activa</strong>
      <img id="preview" alt="preview" />
      <div id="mapMeta">Sin mapa generado.</div>
    </div>

    <script type="module" src="./src/convivencia_3d.js"></script>
  
  </body>
</html>
