<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terreno 3D + Ríos de flujo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0f17;
        font-family: Arial, sans-serif;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #fff;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 12px;
        max-width: 360px;
        font-size: 13px;
        line-height: 1.35;
      }

      #hud button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #2f7cff;
        color: #fff;
        cursor: pointer;
      }

      #hud button:hover {
        background: #4b8dff;
      }

      .control {
        margin-top: 10px;
      }

      .control label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .control input[type="range"] {
        width: 100%;
      }

      #preview {
        width: 100%;
        margin-top: 8px;
        border-radius: 8px;
        display: block;
        background: #1e1e1e;
      }

      #meta {
        margin-top: 8px;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <strong>Terreno 3D + ríos</strong><br />
      - Terreno por luminancia de imagen<br />
      - Flujo por pendiente + ruido (tipo río)<br />
      - Parámetros influenciados por latent

      <button id="randomBtn">Otra imagen aleatoria</button>

      <div class="control">
        <label>
          <span>Altura río</span>
          <span id="liftValue">1.60</span>
        </label>
        <input
          id="liftSlider"
          type="range"
          min="0.2"
          max="5"
          step="0.05"
          value="1.6"
        />
      </div>

      <div class="control">
        <label>
          <span>Grosor línea</span>
          <span id="thicknessValue">3.0</span>
        </label>
        <input
          id="thicknessSlider"
          type="range"
          min="1"
          max="8"
          step="0.2"
          value="3"
        />
      </div>

      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./src/pages/terreno_rios_3d.js"></script>
  
  </body>
</html>
