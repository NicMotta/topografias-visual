<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flujo cromático</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05060a;
        font-family: Arial, sans-serif;
      }

      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 320px;
        color: #fff;
        background: rgba(0, 0, 0, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 12px;
      }

      #panel button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #7b5cff;
        color: #fff;
        cursor: pointer;
      }

      #panel button:hover {
        background: #9076ff;
      }

      #preview {
        width: 100%;
        border-radius: 8px;
        margin-top: 8px;
        background: #111;
      }

      #meta {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.35;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="panel">
      <strong>Opción artística: Flujo cromático</strong><br />
      Interpreta una imagen como nube de partículas viva.
      <button id="randomBtn">Otra imagen aleatoria</button>
      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      let scene, camera, renderer, controls;
      let particles = null;
      let basePositions = null;
      let phaseAttr = null;
      let currentItem = null;

      const preview = document.getElementById("preview");
      const meta = document.getElementById("meta");
      const randomBtn = document.getElementById("randomBtn");

      init();
      await loadRandomArtwork();

      randomBtn.addEventListener("click", loadRandomArtwork);

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05060a);

        camera = new THREE.PerspectiveCamera(
          62,
          window.innerWidth / window.innerHeight,
          0.1,
          5000,
        );
        camera.position.set(0, 25, 180);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const amb = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(amb);

        const d = new THREE.DirectionalLight(0xffffff, 0.5);
        d.position.set(120, 160, 100);
        scene.add(d);

        window.addEventListener("resize", onResize);
        animate();
      }

      async function loadRandomArtwork() {
        try {
          const res = await fetch("./latents.json");
          const data = await res.json();
          const items = data.items || [];
          if (!items.length) return;

          currentItem = items[Math.floor(Math.random() * items.length)];
          const imagePath = `./imagenes_generadas/${currentItem.file}`;

          const imageData = await readImagePixels(imagePath);
          buildParticleArtwork(imageData);

          preview.src = imagePath;
          meta.innerHTML = `
            <strong>${currentItem.file}</strong><br>
            modo: puntos aditivos + oscilación temporal<br>
            coord_1d: ${Number(currentItem.coord_1d).toFixed(4)}
          `;
        } catch (e) {
          console.error(e);
          meta.textContent = "Error generando la visualización artística.";
        }
      }

      function readImagePixels(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext("2d", { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);
            resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
          };
          img.onerror = reject;
          img.src = src;
        });
      }

      function buildParticleArtwork(imageData) {
        if (particles) {
          scene.remove(particles);
          particles.geometry.dispose();
          particles.material.dispose();
          particles = null;
        }

        const srcW = imageData.width;
        const srcH = imageData.height;
        const px = imageData.data;

        const targetW = 170;
        const targetH = Math.max(60, Math.round((srcH / srcW) * targetW));

        const count = targetW * targetH;
        const positions = new Float32Array(count * 3);
        const colors = new Float32Array(count * 3);
        const phase = new Float32Array(count);

        const widthWorld = 180;
        const heightWorld = (widthWorld * srcH) / srcW;

        let p = 0;

        for (let y = 0; y < targetH; y++) {
          for (let x = 0; x < targetW; x++) {
            const u = x / (targetW - 1);
            const v = y / (targetH - 1);

            const ix = Math.min(srcW - 1, Math.floor(u * (srcW - 1)));
            const iy = Math.min(srcH - 1, Math.floor(v * (srcH - 1)));
            const i = (iy * srcW + ix) * 4;

            const r = px[i] / 255;
            const g = px[i + 1] / 255;
            const b = px[i + 2] / 255;
            const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;

            const wx = u * widthWorld - widthWorld / 2;
            const wz = v * heightWorld - heightWorld / 2;
            const wy = (lum - 0.5) * 28;

            positions[p * 3] = wx;
            positions[p * 3 + 1] = wy;
            positions[p * 3 + 2] = wz;

            colors[p * 3] = Math.min(1, r * 1.25);
            colors[p * 3 + 1] = Math.min(1, g * 1.25);
            colors[p * 3 + 2] = Math.min(1, b * 1.25);

            phase[p] = Math.random() * Math.PI * 2;
            p++;
          }
        }

        basePositions = new Float32Array(positions);
        phaseAttr = phase;

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
          size: 1.15,
          vertexColors: true,
          transparent: true,
          opacity: 0.86,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);
      }

      function animate() {
        requestAnimationFrame(animate);

        if (particles && basePositions && phaseAttr) {
          const pos = particles.geometry.attributes.position.array;
          const t = performance.now() * 0.001;

          for (let i = 0; i < phaseAttr.length; i++) {
            const i3 = i * 3;
            const baseX = basePositions[i3];
            const baseY = basePositions[i3 + 1];
            const baseZ = basePositions[i3 + 2];
            const ph = phaseAttr[i];

            pos[i3] = baseX + Math.sin(t * 1.3 + ph) * 0.9;
            pos[i3 + 1] = baseY + Math.cos(t * 2.0 + ph * 0.7) * 1.7;
            pos[i3 + 2] = baseZ + Math.sin(t * 1.1 + ph * 1.2) * 0.9;
          }

          particles.geometry.attributes.position.needsUpdate = true;
          particles.rotation.y += 0.0018;
        }

        controls.update();
        renderer.render(scene, camera);
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
  </body>
</html>
