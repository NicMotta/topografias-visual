<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strudel + Latents · Prueba</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; background: #0f1220; font-family: system-ui, sans-serif; color: #eee; }

      #app {
        max-width: 600px;
        margin: 0 auto;
        padding: 28px 18px 42px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h1 { font-size: 22px; font-weight: 600; }
      .status { font-size: 14px; opacity: 0.8; white-space: nowrap; }

      .image-area {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        overflow: hidden;
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #preview { width: 100%; height: 100%; object-fit: cover; display: block; }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th, td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      th { opacity: 0.7; font-weight: 400; width: 100px; }
      td { font-family: monospace; color: #b8d4ff; }

      .controls {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        background: rgba(255,255,255,0.08);
        color: #eee;
        transition: background 0.2s;
      }
      button:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
      button:disabled { opacity: 0.35; cursor: not-allowed; }
      #startBtn { border-color: #2f7cff; }
      #stopBtn { border-color: #ff4a4a; }

      .pulse.active {
        height: 4px;
        border-radius: 4px;
        background: linear-gradient(90deg, #2f7cff, #b84aff);
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scaleX(0.95); }
        50% { opacity: 1; transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Strudel + Latents</h1>
        <div class="status" id="status">Cargando…</div>
      </header>

      <div class="panel">
        <div class="image-area">
          <img id="preview" alt="preview" />
        </div>
        <table>
          <tr><th>coord_1d</th><td id="coord1d">-</td></tr>
          <tr><th>coord_3d</th><td id="coord3d">-</td></tr>
          <tr><th>hash</th><td id="hash">-</td></tr>
          <tr><th>archivo</th><td id="filename">-</td></tr>
        </table>
        <div class="controls">
          <button id="startBtn">Iniciar</button>
          <button id="stopBtn" disabled>Detener</button>
        </div>
        <div class="pulse" id="pulse"></div>
      </div>
    </div>
    <script type="module" src="./src/strudel_prueba.js"></script>
  </body>
</html>
