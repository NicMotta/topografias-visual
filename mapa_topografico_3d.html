<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa Topográfico 3D</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0d1118;
        font-family: Arial, sans-serif;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #fff;
        background: rgba(0, 0, 0, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 12px;
        width: 360px;
        font-size: 13px;
        line-height: 1.35;
      }

      #hud button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #2f7cff;
        color: #fff;
        cursor: pointer;
      }

      #hud button:hover {
        background: #4b8dff;
      }

      .control {
        margin-top: 10px;
      }

      .control label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        font-size: 12px;
      }

      .control input[type="range"] {
        width: 100%;
      }

      #preview {
        width: 100%;
        margin-top: 8px;
        border-radius: 8px;
        display: block;
        background: #1c1f26;
      }

      #meta {
        margin-top: 8px;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <strong>Topográfico 3D</strong><br />
      - Terreno por luminancia<br />
      - Curvas de nivel (equidistancia)

      <button id="randomBtn">Elegir otra imagen</button>

      <div class="control">
        <label>
          <span>Exageración vertical</span>
          <span id="heightScaleValue">48</span>
        </label>
        <input id="heightScale" type="range" min="12" max="90" step="1" value="48" />
      </div>

      <div class="control">
        <label>
          <span>Equidistancia curvas</span>
          <span id="contourStepValue">2.4</span>
        </label>
        <input id="contourStep" type="range" min="0.8" max="6" step="0.1" value="2.4" />
      </div>

      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./src/pages/mapa_topografico_3d.js"></script>
  
  </body>
</html>
