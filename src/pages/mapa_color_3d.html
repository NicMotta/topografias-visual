<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa 3D por color</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0e0e0e;
        font-family: Arial, sans-serif;
      }

      #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        padding: 12px;
        border-radius: 10px;
        max-width: 340px;
        font-size: 13px;
        line-height: 1.35;
      }

      #hud button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #2f7cff;
        color: #fff;
        cursor: pointer;
      }

      #hud button:hover {
        background: #4b8dff;
      }

      #preview {
        width: 100%;
        margin-top: 8px;
        border-radius: 8px;
        display: block;
        background: #1e1e1e;
        object-fit: contain;
      }

      #meta {
        margin-top: 8px;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <strong>Mapa 3D desde color</strong><br />
      - Toma una imagen aleatoria de <em>imagenes_generadas</em><br />
      - Usa la luminancia del pixel para altura<br />
      - Color original del pixel en la malla

      <button id="randomBtn">Elegir otra imagen aleatoria</button>

      <img id="preview" alt="Preview de imagen seleccionada" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./mapa_color_3d.js"></script>
  
  </body>
</html>
