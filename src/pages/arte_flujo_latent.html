<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flujo cromático</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #05060a;
        font-family: Arial, sans-serif;
      }

      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 320px;
        color: #fff;
        background: rgba(0, 0, 0, 0.68);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 12px;
      }

      #panel button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #7b5cff;
        color: #fff;
        cursor: pointer;
      }

      #panel button:hover {
        background: #9076ff;
      }

      #preview {
        width: 100%;
        border-radius: 8px;
        margin-top: 8px;
        background: #111;
      }

      #meta {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.35;
        word-break: break-word;
      }

      canvas {
        display: block;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="panel">
      <strong>Opción artística: Flujo cromático</strong><br />
      Interpreta una imagen como nube de partículas viva.
      <button id="randomBtn">Otra imagen aleatoria</button>
      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./arte_flujo_latent.js"></script>
  
  </body>
</html>
