<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa 3D por color</title>
    <link rel="stylesheet" href="./index.css">

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <strong>Mapa 3D desde color</strong><br />
      - Toma una imagen aleatoria de <em>imagenes_generadas</em><br />
      - Usa la luminancia del pixel para altura<br />
      - Color original del pixel en la malla

      <button id="randomBtn">Elegir otra imagen aleatoria</button>

      <img id="preview" alt="Preview de imagen seleccionada" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./index.js"></script>
  
  </body>
</html>
