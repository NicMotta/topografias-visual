<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terreno 3D + Ríos de flujo</title>
    <link rel="stylesheet" href="./index.css">

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <strong>Terreno 3D + ríos</strong><br />
      - Terreno por luminancia de imagen<br />
      - Flujo por pendiente + ruido (tipo río)<br />
      - Parámetros influenciados por latent

      <button id="randomBtn">Otra imagen aleatoria</button>

      <div class="control">
        <label>
          <span>Altura río</span>
          <span id="liftValue">1.60</span>
        </label>
        <input
          id="liftSlider"
          type="range"
          min="0.2"
          max="5"
          step="0.05"
          value="1.6"
        />
      </div>

      <div class="control">
        <label>
          <span>Grosor línea</span>
          <span id="thicknessValue">3.0</span>
        </label>
        <input
          id="thicknessSlider"
          type="range"
          min="1"
          max="8"
          step="0.2"
          value="3"
        />
      </div>

      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./index.js"></script>
  
  </body>
</html>
