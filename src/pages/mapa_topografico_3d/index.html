<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>html{background:#0a0a0b}</style>
    <title>Mapa Topográfico 3D</title>
    <link rel="stylesheet" href="./index.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="hud">
      <strong>Topográfico 3D</strong><br />
      - Terreno por luminancia<br />
      - Curvas de nivel (equidistancia)

      <button id="randomBtn">Elegir otra imagen</button>

      <div class="control">
        <label>
          <span>Exageración vertical</span>
          <span id="heightScaleValue">48</span>
        </label>
        <input
          id="heightScale"
          type="range"
          min="12"
          max="90"
          step="1"
          value="48"
        />
      </div>

      <div class="control">
        <label>
          <span>Equidistancia curvas</span>
          <span id="contourStepValue">2.4</span>
        </label>
        <input
          id="contourStep"
          type="range"
          min="0.8"
          max="6"
          step="0.1"
          value="2.4"
        />
      </div>

      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
