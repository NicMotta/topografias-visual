<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIDI Test · Identificación de controles</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>MIDI Test</h1>
        <div class="status" id="status">Cargando…</div>
      </header>

      <div class="panel">
        <label class="field">
          <span>Entrada MIDI</span>
          <select id="midiInput" disabled>
            <option>Cargando…</option>
          </select>
        </label>
        <div class="controls">
          <button id="rescanBtn">Buscar dispositivos</button>
        </div>
      </div>

      <div class="panel indicator">
        <div class="light" id="light"></div>
        <div class="name" id="eventName">—</div>
        <div class="sub" id="eventSub">Esperando evento…</div>
      </div>

      <div class="panel">
        <div class="last-label">Últimos eventos</div>
        <ul class="history" id="history"></ul>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
  </body>
</html>
