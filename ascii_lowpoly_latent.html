<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Low Poly Latent</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #06070a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 10;
        width: 360px;
        color: #fff;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        padding: 12px;
        backdrop-filter: blur(6px);
      }

      #panel button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #f39c42;
        color: #111;
        cursor: pointer;
        font-weight: 700;
      }

      #panel button:hover {
        background: #ffb55f;
      }

      #preview {
        width: 100%;
        margin-top: 8px;
        border-radius: 8px;
        display: block;
        background: #111;
      }

      #meta {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.35;
        word-break: break-word;
      }

      #canvas {
        display: block;
      }

      .hint {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <strong>ASCII Low Poly</strong><br />
      Imagen convertida en mosaico alfanumérico con sensación low-poly.
      <div class="hint">- letras más densas = sombras</div>
      <div class="hint">- colores tomados de la imagen original</div>
      <button id="randomBtn">Otra imagen / otra pieza</button>
      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module" src="./src/ascii_lowpoly_latent.js"></script>
  
  </body>
</html>
