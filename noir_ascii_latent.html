<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noir ASCII Latent</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
      }

      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 360px;
        z-index: 10;
        color: #f2f2f2;
        background: rgba(0, 0, 0, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 12px;
        backdrop-filter: blur(6px);
      }

      #panel button {
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #f5f5f5;
        color: #111;
        cursor: pointer;
        font-weight: 700;
      }

      #panel button:hover {
        background: #ffffff;
      }

      .control {
        margin-top: 10px;
      }

      .control label {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        margin-bottom: 4px;
      }

      .control input[type="range"] {
        width: 100%;
      }

      #preview {
        width: 100%;
        margin-top: 8px;
        border-radius: 8px;
        display: block;
        background: #111;
      }

      #meta {
        margin-top: 8px;
        font-size: 12px;
        line-height: 1.35;
        word-break: break-word;
      }

      #canvas {
        display: block;
      }

      .hint {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="panel">
      <strong>Noir ASCII</strong><br />
      Blanco y negro, con textura tipo grabado, dithering y ritmo latente.
      <div class="hint">- más contraste: más densidad visual</div>
      <div class="hint">- controlá el dramatismo con los sliders</div>

      <button id="randomBtn">Otra imagen / otro clima</button>

      <div class="control">
        <label>
          <span>Contraste</span>
          <span id="contrastValue">1.45</span>
        </label>
        <input id="contrastSlider" type="range" min="0.6" max="2.8" step="0.05" value="1.45" />
      </div>

      <div class="control">
        <label>
          <span>Densidad</span>
          <span id="densityValue">1.00</span>
        </label>
        <input id="densitySlider" type="range" min="0.7" max="1.5" step="0.05" value="1" />
      </div>

      <img id="preview" alt="preview" />
      <div id="meta">Cargando...</div>
    </div>

    <canvas id="canvas"></canvas>

    <script type="module" src="./src/pages/noir_ascii_latent.js"></script>
  
  </body>
</html>
